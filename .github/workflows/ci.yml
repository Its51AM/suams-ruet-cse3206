name: SUAMS CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "test/**"
      - "docs/**"
  pull_request:
    branches:
      - main

jobs:
  unit-and-integration-tests:
    name: Unit, Mock & Integration Tests + Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with coverage
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-ephemeral-test-key-replace-in-prod
        run: |
          pytest tests/unit tests/integration --cov=app --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-and-coverage-reports
          path: |
            coverage.xml
            test-results.xml

  selenium-ui-tests:
    name: Selenium E2E UI Tests
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Headless Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Selenium UI tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-ephemeral-ui-test-key-replace-in-prod
        run: |
          pytest tests/ui --junitxml=ui-test-results.xml

      - name: Upload Selenium UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-ui-test-report
          path: ui-test-results.xml
